# Cannon Territory Bridge — recommended defaults (Forge copies on first run)

[hyw_sync]
	#Count HYW soldiers for Recruits sieges via the owner's faction team (read-only; does not modify entities).
	syncHywTeams = true
	#Mirror Recruits faction diplomacy into HYW RelationSystem.
	syncDiplomacyToHyw = true
	#If false, HywHorseEntity is not counted for sieges (rider still counts).
	countMountedHorsesForSiege = false
	#Count HYW cannons and trebuchets in siege totals.
	countHywSiegeWeapons = true
	#Minimum minutes to capture a claim once siege damage starts (Recruits ticks every 5 s).
	minCaptureMinutes = 3
	#Scale siege damage by attacker/defender ratio (more defenders = slower capture).
	applySiegeSpeedToDamage = true
	#No capture progress while defenders >= attackers (garrison must be outnumbered).
	requireAttackerAdvantage = true
	#On-screen siege timer and claim HP while inside a besieged claim.
	showSiegeTimer = true
	#HYW recruitment only inside your own Recruits claim.
	requireOwnClaimToMobilize = true
	#Player must create an HYW squad before recruiting.
	requireSquadToMobilize = true
	#Creative mode does not skip recruitment restrictions.
	allowCreativeBypass = false

[recruits_strip]
	blockRecruitsEntities = true
	blockRecruitHire = true
	blockVillagerClaimTakeover = true
	blockRecruitCommandUi = true
